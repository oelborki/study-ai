name: CI

on:
  push:
    branches: ['*']  # Run on all branches
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Build application
        run: npm run build
        env:
          # Dummy values for build (not used, just needed for Next.js to compile)
          DATABASE_URL: "postgresql://user:pass@localhost:5432/db"
